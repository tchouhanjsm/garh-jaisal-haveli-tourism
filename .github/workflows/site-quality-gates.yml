name: Site quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install pinned browser smoke dependency
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Install Chromium and runner dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run site and content quality suite
        env:
          BROWSER_SMOKE_SCREENSHOTS_DIR: ${{ runner.temp }}/garh-jaisal-visual-evidence
          BROWSER_SMOKE_REPORT_PATH: ${{ runner.temp }}/garh-jaisal-visual-evidence/report.json
          BROWSER_SMOKE_JOURNAL_EVIDENCE_DIR: ${{ runner.temp }}/garh-jaisal-journal-preview-evidence
        run: bash scripts/check-pr-quality.sh

      - name: Upload responsive visual baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garh-jaisal-visual-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/garh-jaisal-visual-evidence/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Upload local-only Journal preview evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garh-jaisal-journal-preview-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/garh-jaisal-journal-preview-evidence/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Build guarded staging preview archive
        run: |
          python3 scripts/package-staging-preview.py \
            --output "${RUNNER_TEMP}/garh-jaisal-preview" \
            --archive "${RUNNER_TEMP}/garh-jaisal-staging-preview.zip" \
            --commit-sha "$GITHUB_SHA" \
            --source-ref "${GITHUB_HEAD_REF:-$GITHUB_REF}" \
            --run-id "$GITHUB_RUN_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --quality-passed

      - name: Validate packaged responsive image delivery
        run: |
          MEDIA_PERFORMANCE_ROOT="${RUNNER_TEMP}/garh-jaisal-preview" \
          MEDIA_PERFORMANCE_CONTRACT_ROOT="${GITHUB_WORKSPACE}" \
            node scripts/test-page-media-performance.js

      - name: Verify responsive images in packaged Chromium preview
        run: |
          BROWSER_SMOKE_ROOT="${RUNNER_TEMP}/garh-jaisal-preview" \
          BROWSER_SMOKE_CONTRACT_ROOT="${GITHUB_WORKSPACE}" \
            python3 scripts/test-browser-smoke.py --responsive-image-preview

      - name: Upload guarded staging preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garh-jaisal-staging-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/garh-jaisal-staging-preview.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
