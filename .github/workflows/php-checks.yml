name: PHP integration checks
on:
  push:
    branches: [main, feat/guest-first-home-navigation-20261119]
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-checks.yml'
      - 'includes/**'
      - 'scripts/test-php-browser.py'
      - 'scripts/test-php-seo.py'
      - 'assets/css/php-upgrade.css'
      - 'assets/css/guest-first.css'
permissions:
  contents: read
jobs:
  php-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Syntax check
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Rendered PHP SEO audit
        run: python3 scripts/test-php-seo.py
      - name: HTML route and content integration assertions
        shell: bash
        run: |
          set -euo pipefail
          for route in index about rooms gallery dining directions experiences experience-details journal car-services privacy-policy booking-policy; do
            html="$(php "${route}.php")"
            grep -qi '<!doctype html' <<<"$html"
            grep -q 'assets/css/php-upgrade.css' <<<"$html"
            grep -q 'href="booking.php"' <<<"$html" || { echo "Missing stay enquiry: $route"; exit 1; }
          done
          home="$(php index.php)"
          grep -q 'data-booking-link' <<<"$home"
          grep -q 'data-enquiry-link' <<<"$home"
          grep -q 'data-enquiry-message' <<<"$home"
          grep -q 'href="rooms.php"' <<<"$home"
          grep -q 'href="booking.php"' <<<"$home"
          grep -q 'assets/images/rest3.jpg' <<<"$home"
          grep -q 'href="car-services.php"' <<<"$home"
          grep -q 'href="journal.php"' <<<"$home"
          grep -q 'href="privacy-policy.php"' <<<"$home"
          test "$(grep -o '<section' <<<"$home" | wc -l | tr -d ' ')" -le 7
          grep -q '<form method="post"' <(php booking.php)
          test -f content/site-config.json
          test -f assets/site.js
      - name: HTTP route and form checks
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8787 -t . > /tmp/php-hotel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8787/index.php > /tmp/hotel-home.html && break || sleep 1; done
          grep -q 'Stay Enquiry' /tmp/hotel-home.html
          curl -fsS http://127.0.0.1:8787/booking.php | grep -q 'Send stay enquiry'
          curl -fsS http://127.0.0.1:8787/rooms.php | grep -q 'room-card-grid'
          curl -fsS http://127.0.0.1:8787/journal.php | grep -q 'The Garh Jaisal'
          curl -fsS http://127.0.0.1:8787/car-services.php | grep -q 'Car services'
          curl -fsS http://127.0.0.1:8787/privacy-policy.php | grep -q 'Privacy information'
          curl -sS -X POST http://127.0.0.1:8787/booking.php -d 'name=X' | grep -q 'couldn.t submit your enquiry'
          # Malformed CSRF must fail cleanly, without PHP fatal errors.
          curl -sS -X POST http://127.0.0.1:8787/booking.php --data-urlencode 'csrf[]=invalid' | grep -q 'couldn.t submit your enquiry'
          # Reject unapproved HTTP verbs.
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8787/booking.php)" = '405'
          # Enquiry pages must not be cached or indexed.
          curl -sSI http://127.0.0.1:8787/booking.php | grep -qi 'cache-control: no-store'
          curl -sSI http://127.0.0.1:8787/booking.php | grep -qi 'x-robots-tag: noindex'

      - name: Install Python Playwright
        run: python3 -m pip install -r requirements-test.txt --break-system-packages
      - name: Install browser
        run: python3 -m playwright install --with-deps chromium
      - name: Responsive PHP browser QA and screenshot evidence
        env:
          PHP_VISUAL_EVIDENCE: ${{ runner.temp }}/php-visual-evidence
        run: python3 scripts/test-php-browser.py
      - name: Upload PHP visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-responsive-evidence
          path: ${{ runner.temp }}/php-visual-evidence/
          if-no-files-found: warn
          retention-days: 7
