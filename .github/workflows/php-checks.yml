name: PHP integration checks
on:
  push:
    branches: [feat/premium-php-enquiries]
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-checks.yml'
      - 'includes/**'
permissions:
  contents: read
jobs:
  php-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Syntax check
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: HTML route and content integration assertions
        shell: bash
        run: |
          set -euo pipefail
          for route in index about rooms gallery dining directions experiences experience-details; do
            html="$(php "${route}.php")"
            grep -qi '<!doctype html' <<<"$html"
            grep -q 'assets/css/php-upgrade.css' <<<"$html"
            grep -q 'href="booking.php"' <<<"$html" || { echo "Missing stay enquiry: $route"; exit 1; }
          done
          home="$(php index.php)"
          grep -q 'data-booking-link' <<<"$home"
          grep -q 'data-enquiry-link' <<<"$home"
          grep -q 'data-enquiry-message' <<<"$home"
          grep -q 'href="rooms.php"' <<<"$home"
          grep -q 'href="booking.php"' <<<"$home"
          grep -q 'assets/images/rest3.jpg' <<<"$home"
          grep -q '<form method="post"' <(php booking.php)
          test -f content/site-config.json
          test -f assets/site.js
      - name: HTTP route and form checks
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8787 -t . > /tmp/php-hotel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8787/index.php > /tmp/hotel-home.html && break || sleep 1; done
          grep -q 'Stay Enquiry' /tmp/hotel-home.html
          curl -fsS http://127.0.0.1:8787/booking.php | grep -q 'Send stay enquiry'
          curl -fsS http://127.0.0.1:8787/rooms.php | grep -q 'room-card-grid'
          curl -sS -X POST http://127.0.0.1:8787/booking.php -d 'name=X' | grep -q 'couldn.t submit your enquiry'
